# EvoFlow Production Environment
# Usage: make up
#
# Services:
#   - gateway:     FastAPI Gateway API
#   - langgraph:   LangGraph production server (Dockerfile generated by langgraph dockerfile)
#   - provisioner: (optional) Sandbox provisioner for Kubernetes mode
#   - frontend:    (optional) nginx serving evopanel/dist + reverse proxy on :2026
#   - postgres:    (optional, --profile cloud) PostgreSQL for multi-worker cloud mode
#   - redis:       (optional, --profile cloud) shared lock store for multi-worker mode
#
# Key environment variables (set via environment/.env or scripts/deploy.sh):
#   EVOFLOW_HOME                   — runtime data dir, default $REPO_ROOT/backend/.evoflow
#   EVOFLOW_CONFIG_PATH            — path to config.yaml
#   EVOFLOW_EXTENSIONS_CONFIG_PATH — path to extensions_config.json
#   EVOFLOW_DOCKER_SOCKET          — Docker socket path, default /var/run/docker.sock
#   EVOFLOW_REPO_ROOT              — repo root (used for skills host path in DooD)
#   EVOFLOW_DB_URL                 — PostgreSQL URL; unset = SQLite (default)
#   EVOFLOW_REDIS_URL              — Redis URL; required for EVOFLOW_GATEWAY_WORKERS>1
#   EVOFLOW_GATEWAY_WORKERS        — uvicorn workers, default 1
#
# LangSmith tracing is disabled by default (LANGSMITH_TRACING=false).
# Set LANGSMITH_TRACING=true and LANGSMITH_API_KEY in .env to enable it.
#
# Access: http://localhost:8001 (Gateway), http://localhost:2024 (LangGraph),
#         http://localhost:2026 (frontend + reverse proxy, --profile frontend)

services:
  # ── Gateway API ────────────────────────────────────────────────────────────
  gateway:
    build:
      context: ../
      dockerfile: backend/Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.7.20}
    container_name: evo-flow-gateway
    # Workers default to 1. Multi-worker is safe when EVOFLOW_REDIS_URL is set
    # (the MCP OAuth token-refresh lock becomes a Redis SET NX cross-process
    # lock); without Redis, workers fall back to per-process locks and
    # concurrent token refreshes may hit invalid_grant (the gateway logs a
    # loud warning at startup in that case).
    command: sh -c "cd backend && PYTHONPATH=. uv run uvicorn app.gateway.app:app --host 0.0.0.0 --port 8001 --workers ${EVOFLOW_GATEWAY_WORKERS:-1} --timeout-keep-alive 30"
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ${EVOFLOW_CONFIG_PATH}:/app/backend/config.yaml:ro
      - ${EVOFLOW_EXTENSIONS_CONFIG_PATH}:/app/backend/extensions_config.json:ro
      - ../skills:/app/skills:ro
      - ${EVOFLOW_HOME}:/app/backend/.evoflow
      # DooD: AioSandboxProvider starts sandbox containers via host Docker daemon
      - ${EVOFLOW_DOCKER_SOCKET}:/var/run/docker.sock
      # CLI auth directories for auto-auth (Claude Code + runtime CLI)
      - type: bind
        source: ${HOME:?HOME must be set}/.claude
        target: /root/.claude
        read_only: true
        bind:
          create_host_path: true
      - type: bind
        source: ${HOME:?HOME must be set}/.codex
        target: /root/.codex
        read_only: true
        bind:
          create_host_path: true
    working_dir: /app
    environment:
      - CI=true
      - EVOFLOW_HOME=/app/backend/.evoflow
      # Public origin for MCP OAuth redirect_uri. nginx overwrites the
      # X-Forwarded-* headers, so proxy-header trust is enabled below.
      - EVOFLOW_PUBLIC_BASE_URL=${EVOFLOW_PUBLIC_BASE_URL:-}
      - EVOFLOW_TRUST_PROXY_HEADERS=1
      - EVOFLOW_CHANNELS_LANGGRAPH_URL=${EVOFLOW_CHANNELS_LANGGRAPH_URL:-http://langgraph:2024}
      - EVOFLOW_CHANNELS_GATEWAY_URL=${EVOFLOW_CHANNELS_GATEWAY_URL:-http://gateway:8001}
      # DooD path/network translation
      - EVOFLOW_HOST_BASE_DIR=${EVOFLOW_HOME}
      - EVOFLOW_HOST_SKILLS_PATH=${EVOFLOW_REPO_ROOT}/skills
      - EVOFLOW_SANDBOX_HOST=host.docker.internal
      # Multi-worker cloud mode (see docs/contribute/deploy-cloud.md):
      #   EVOFLOW_DB_URL switches the main app DB from SQLite to PostgreSQL
      #   (needs the 'postgres' extra; start postgres via --profile cloud).
      #   EVOFLOW_REDIS_URL enables cross-process locks so
      #   EVOFLOW_GATEWAY_WORKERS can be raised above 1.
      # Both default to empty (SQLite + single-process locks = desktop mode).
      - EVOFLOW_DB_URL=${EVOFLOW_DB_URL:-}
      - EVOFLOW_REDIS_URL=${EVOFLOW_REDIS_URL:-}
      - EVOFLOW_GATEWAY_WORKERS=${EVOFLOW_GATEWAY_WORKERS:-1}
    env_file:
      - ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - evo-flow
    restart: unless-stopped

  # ── LangGraph Server ───────────────────────────────────────────────────────
  # TODO: switch to langchain/langgraph-api (licensed) once a license key is available.
  # For now, use `langgraph dev` (no license required) with the standard backend image.
  langgraph:
    build:
      context: ../
      dockerfile: backend/Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.7.20}
    container_name: evo-flow-langgraph
    command: sh -c "cd /app/backend && uv run langgraph dev --no-browser --allow-blocking --no-reload --host 0.0.0.0 --port 2024"
    ports:
      - "127.0.0.1:2024:2024"
    volumes:
      - ${EVOFLOW_CONFIG_PATH}:/app/config.yaml:ro
      - ${EVOFLOW_EXTENSIONS_CONFIG_PATH}:/app/extensions_config.json:ro
      - ${EVOFLOW_HOME}:/app/backend/.evoflow
      - ../skills:/app/skills:ro
      - ../backend/.langgraph_api:/app/backend/.langgraph_api
      # DooD: same as gateway
      - ${EVOFLOW_DOCKER_SOCKET}:/var/run/docker.sock
      # CLI auth directories for auto-auth (Claude Code + runtime CLI)
      - type: bind
        source: ${HOME:?HOME must be set}/.claude
        target: /root/.claude
        read_only: true
        bind:
          create_host_path: true
      - type: bind
        source: ${HOME:?HOME must be set}/.codex
        target: /root/.codex
        read_only: true
        bind:
          create_host_path: true
    environment:
      - CI=true
      - EVOFLOW_HOME=/app/backend/.evoflow
      - EVOFLOW_CONFIG_PATH=/app/config.yaml
      - EVOFLOW_EXTENSIONS_CONFIG_PATH=/app/extensions_config.json
      - EVOFLOW_HOST_BASE_DIR=${EVOFLOW_HOME}
      - EVOFLOW_HOST_SKILLS_PATH=${EVOFLOW_REPO_ROOT}/skills
      - EVOFLOW_SANDBOX_HOST=host.docker.internal
      # Disable LangSmith tracing — LANGSMITH_API_KEY is not required.
      # Set LANGSMITH_TRACING=true and LANGSMITH_API_KEY in .env to enable.
      - LANGSMITH_TRACING=${LANGSMITH_TRACING:-false}
    env_file:
      - ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - evo-flow
    restart: unless-stopped

  # ── Sandbox Provisioner (optional, Kubernetes mode) ────────────────────────
  provisioner:
    profiles:
      - provisioner
    build:
      context: ./provisioner
      dockerfile: Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-}
    container_name: evo-flow-provisioner
    volumes:
      - ~/.kube/config:/root/.kube/config:ro
    environment:
      - K8S_NAMESPACE=evo-flow
      - SANDBOX_IMAGE=enterprise-public-cn-beijing.cr.volces.com/vefaas-public/all-in-one-sandbox:latest
      - SKILLS_HOST_PATH=${EVOFLOW_REPO_ROOT}/skills
      - THREADS_HOST_PATH=${EVOFLOW_HOME}/threads
      - KUBECONFIG_PATH=/root/.kube/config
      - NODE_HOST=host.docker.internal
      - K8S_API_SERVER=https://host.docker.internal:26443
    env_file:
      - ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - evo-flow
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 6

  # ── Web frontend + reverse proxy (optional) ────────────────────────────────
  # Serves evopanel/dist at / and proxies /api/*, /health, /docs, ... to the
  # gateway/langgraph containers, all on port 2026.
  #
  # Opt-in (same pattern as provisioner): plain `make up` does NOT start it.
  #   docker compose -p evo-flow -f docker/docker-compose.yaml \
  #     --profile frontend up -d
  #
  # Prerequisite: evopanel/dist must exist on the deploy host (it is gitignored):
  #   cd evopanel && pnpm install && pnpm run build
  # then sync evopanel/dist to the server (scp/rsync or a CI artifact).
  #
  # NOTE: plain `make up` passes --remove-orphans, which REMOVES a running
  # frontend container — re-run the --profile frontend command afterwards.
  frontend:
    profiles:
      - frontend
    # docker/nginx/nginx.conf uses `server ... resolve` in upstream blocks,
    # which needs open-source nginx >= 1.27.3. nginx:alpine tracks >= 1.29.
    image: nginx:alpine
    container_name: evo-flow-frontend
    ports:
      - "${EVOFLOW_FRONTEND_BIND:-127.0.0.1}:2026:2026"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../evopanel/dist:/usr/share/nginx/html:ro
    depends_on:
      - gateway
      - langgraph
    networks:
      - evo-flow
    restart: unless-stopped
    healthcheck:
      # alpine has no curl; busybox wget is always present. /health is proxied
      # to the gateway, so this validates both nginx and the upstream chain.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:2026/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
  # ── PostgreSQL (optional, cloud profile) ───────────────────────────────────
  # Multi-worker cloud mode: set EVOFLOW_DB_URL in ../.env to
  #   postgresql://evoflow:${EVOFLOW_POSTGRES_PASSWORD:-evoflow}@postgres:5432/evoflow
  # and start with: docker compose -p evo-flow -f docker/docker-compose.yaml \
  #                   --profile cloud up -d
  # Plain `make up` does NOT start this service (default stays SQLite).
  postgres:
    profiles:
      - cloud
    # pgvector image = official postgres:16 + the `vector` extension prebuilt
    # (required by the knowledge-base vector store in PG mode).
    image: pgvector/pgvector:pg16
    container_name: evo-flow-postgres
    environment:
      - POSTGRES_USER=evoflow
      - POSTGRES_PASSWORD=${EVOFLOW_POSTGRES_PASSWORD:-evoflow}
      - POSTGRES_DB=evoflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evoflow -d evoflow"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - evo-flow
    restart: unless-stopped

  # ── Redis (optional, cloud profile) ────────────────────────────────────────
  # Shared lock store for multi-worker mode. Set EVOFLOW_REDIS_URL in ../.env to
  #   redis://redis:6379/0
  # to make EVOFLOW_GATEWAY_WORKERS>1 safe (cross-process MCP OAuth refresh lock).
  redis:
    profiles:
      - cloud
    image: redis:7-alpine
    container_name: evo-flow-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - evo-flow
    restart: unless-stopped

networks:
  evo-flow:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
